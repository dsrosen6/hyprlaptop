version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    files:
      - systemd/hyprdocked.service

aurs:
  - name: hyprdocked-bin
    homepage: https://github.com/dsrosen6/hyprdocked
    description: Laptop display helper for Hyprland
    maintainers:
      - Danny Rosenthal <dsrosen6@gmail.com>
    license: MIT
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/hyprdocked-bin.git
    depends:
      - hyprland
    package: |-
      install -Dm755 hyprdocked "$pkgdir/usr/bin/hyprdocked"
      install -Dm644 systemd/hyprdocked.service \
          "$pkgdir/usr/lib/systemd/user/hyprdocked.service"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
